<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Расписание ВГАТК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #F3F5F7;
    --bg-raised: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --line: rgba(27,36,48,0.10);
    --accent: #FF6B4A;
    --accent-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,25,35,0.04), 0 6px 16px rgba(20,25,35,0.06);
    --day-0: #FF6B4A;
    --day-1: #2FA8A0;
    --day-2: #F2B84B;
    --day-3: #6C8EF5;
    --day-4: #E5578F;
    --day-5: #6FBF73;
    --day-6: #A98CE0;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14181D;
    --bg-raised: #1C222A;
    --ink: #EDEFF2;
    --ink-soft: #9AA4B2;
    --line: rgba(237,239,242,0.10);
    --accent: #FF7A5C;
    --accent-ink: #14181D;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.28);
    --day-0: #FF7A5C;
    --day-1: #3FC7BE;
    --day-2: #F5C768;
    --day-3: #86A2FF;
    --day-4: #F07AAB;
    --day-5: #86D08A;
    --day-6: #BBA3EE;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px 16px 32px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    transition: background 0.25s ease, color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  h1, .day-label { font-family: "Space Grotesk", "Inter", sans-serif; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .topbar h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .topbar .subtitle {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }
  .theme-toggle:active { transform: scale(0.92); }
  .theme-toggle svg { width: 18px; height: 18px; }

  .chip-row, .day-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 14px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar, .day-tabs::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    font-family: "Space Grotesk", sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }

  .day-tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  .day-tab .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dot-color, var(--accent));
  }
  .day-tab.today .dot { animation: pulse 1.8s ease-in-out infinite; }
  .day-tab.active {
    color: var(--ink);
    border-color: var(--dot-color, var(--accent));
    background: color-mix(in srgb, var(--dot-color, var(--accent)) 12%, var(--bg-raised));
  }

  .schedule { position: relative; min-height: 120px; }
  .day-block { animation: fadeSlideUp 0.32s ease both; }

  .lesson {
    display: flex;
    gap: 12px;
    background: var(--bg-raised);
    border-radius: 14px;
    border-left: 3px solid var(--dot-color, var(--accent));
    box-shadow: var(--shadow);
    padding: 12px 14px;
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeSlideUp 0.32s ease forwards;
  }
  .lesson .badge {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 14px;
    background: color-mix(in srgb, var(--dot-color, var(--accent)) 16%, var(--bg-raised));
    color: var(--dot-color, var(--accent));
  }
  .lesson .content { min-width: 0; }
  .lesson .time { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 2px; }
  .lesson .subject { font-weight: 600; margin-bottom: 2px; line-height: 1.3; }
  .lesson .meta { font-size: 13px; color: var(--ink-soft); }

  .state {
    text-align: center;
    padding: 48px 12px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .state .icon { font-size: 28px; margin-bottom: 8px; }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--dot-color, var(--accent)) 45%, transparent); }
    50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--dot-color, var(--accent)) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .day-block, .lesson { animation: none !important; opacity: 1 !important; }
    .day-tab.today .dot { animation: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Расписание</h1>
      <span class="subtitle">ВГАТК</span>
    </div>
    <button id="themeToggle" class="theme-toggle" aria-label="Сменить тему"></button>
  </header>

  <div id="groupChips" class="chip-row"></div>
  <div id="dayTabs" class="day-tabs"></div>
  <main id="schedule" class="schedule">
    <div class="state"><div class="icon">⏳</div>Загрузка...</div>
  </main>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- тема ---------- */
const THEME_ORDER = ['auto', 'light', 'dark'];
const THEME_ICONS = {
  auto:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 0 0 0 18 9 9 0 0 0 0-18Z"/><path d="M12 3v18" stroke-dasharray="3 3"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.7 15.5A8.5 8.5 0 1 1 8.5 3.3a7 7 0 0 0 12.2 12.2Z"/></svg>'
};

function applyTheme(mode) {
  const root = document.documentElement;
  let resolved = mode;
  if (mode === 'auto') {
    resolved = (tg && tg.colorScheme) ? tg.colorScheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  root.setAttribute('data-theme', resolved);
  document.getElementById('themeToggle').innerHTML = THEME_ICONS[mode];
}

let themeMode = localStorage.getItem('vgatk_theme') || 'auto';
applyTheme(themeMode);
document.getElementById('themeToggle').addEventListener('click', () => {
  const idx = (THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length;
  themeMode = THEME_ORDER[idx];
  localStorage.setItem('vgatk_theme', themeMode);
  applyTheme(themeMode);
});

/* ---------- данные ---------- */
const DAY_ORDER = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const TODAY_NAME = DAY_ORDER[(new Date().getDay() + 6) % 7];

const chipsEl = document.getElementById('groupChips');
const tabsEl = document.getElementById('dayTabs');
const scheduleEl = document.getElementById('schedule');

let currentGroup = localStorage.getItem('vgatk_group');
let lessonsByDay = {};
let activeDay = null;

function stateHTML(icon, text) {
  return `<div class="state"><div class="icon">${icon}</div>${text}</div>`;
}

async function loadGroups() {
  try {
    const res = await fetch('/api/groups');
    const groups = await res.json();
    if (!groups.length) {
      scheduleEl.innerHTML = stateHTML('🗓️', 'Расписание пока не загружено');
      return;
    }
    if (!currentGroup || !groups.includes(currentGroup)) currentGroup = groups[0];

    chipsEl.innerHTML = groups.map(g =>
      `<button class="chip${g === currentGroup ? ' active' : ''}" data-group="${g}">${g}</button>`
    ).join('');

    chipsEl.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        currentGroup = chip.dataset.group;
        localStorage.setItem('vgatk_group', currentGroup);
        chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        loadSchedule();
      });
    });

    loadSchedule();
  } catch (e) {
    scheduleEl.innerHTML = stateHTML('⚠️', 'Не удалось загрузить список групп');
  }
}

async function loadSchedule() {
  scheduleEl.innerHTML = stateHTML('⏳', 'Загрузка...');
  try {
    const res = await fetch(`/api/schedule/${encodeURIComponent(currentGroup)}`);
    const lessons = await res.json();
    if (!lessons.length) {
      tabsEl.innerHTML = '';
      scheduleEl.innerHTML = stateHTML('📭', 'Нет данных для этой группы');
      return;
    }
    lessonsByDay = {};
    for (const l of lessons) (lessonsByDay[l.day] ??= []).push(l);

    const days = DAY_ORDER.filter(d => lessonsByDay[d]);
    activeDay = days.includes(TODAY_NAME) ? TODAY_NAME : days[0];
    renderDayTabs(days);
    renderDay(activeDay);
  } catch (e) {
    scheduleEl.innerHTML = stateHTML('⚠️', 'Ошибка загрузки расписания');
  }
}

function renderDayTabs(days) {
  tabsEl.innerHTML = days.map(day => {
    const idx = DAY_ORDER.indexOf(day);
    const isToday = day === TODAY_NAME;
    return `<button class="day-tab${day === activeDay ? ' active' : ''}${isToday ? ' today' : ''}"
              style="--dot-color: var(--day-${idx})" data-day="${day}">
              <span class="dot"></span>${day.slice(0,2)}${isToday ? ' · сегодня' : ''}
            </button>`;
  }).join('');

  tabsEl.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeDay = tab.dataset.day;
      tabsEl.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', t === tab));
      renderDay(activeDay);
    });
  });
}

function renderDay(day) {
  const idx = DAY_ORDER.indexOf(day);
  const items = [...lessonsByDay[day]].sort((a, b) => a.pair_number - b.pair_number);
  scheduleEl.innerHTML = `<div class="day-block" style="--dot-color: var(--day-${idx})">
    ${items.map((l, i) => `
      <div class="lesson" style="--dot-color: var(--day-${idx}); animation-delay: ${i * 40}ms">
        <div class="badge">${l.pair_number}</div>
        <div class="content">
          <div class="time">${l.time}</div>
          <div class="subject">${l.subject}</div>
          <div class="meta">${l.room ? 'ауд. ' + l.room : ''}${l.room && l.teacher ? ' · ' : ''}${l.teacher || ''}</div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

loadGroups();
</script>
</body>
</html>
