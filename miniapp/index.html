<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Расписание ВГАТК</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  h2 { margin: 0 0 12px; }
  select {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
  }
  .day { margin-bottom: 22px; }
  .day h3 {
    margin: 0 0 8px;
    color: var(--tg-theme-link-color, #2481cc);
  }
  .lesson {
    border: 1px solid rgba(120,120,120,0.25);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .lesson .time { font-weight: 600; margin-bottom: 2px; }
  .lesson .subject { margin-bottom: 2px; }
  .lesson .meta { font-size: 13px; opacity: 0.7; }
  .empty { text-align: center; opacity: 0.6; margin-top: 60px; }
</style>
</head>
<body>
  <h2>Расписание ВГАТК</h2>
  <select id="groupSelect"></select>
  <div id="schedule"><div class="empty">Загрузка...</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const groupSelect = document.getElementById('groupSelect');
const scheduleDiv = document.getElementById('schedule');

async function loadGroups() {
  try {
    const res = await fetch('/api/groups');
    const groups = await res.json();
    if (!groups.length) {
      groupSelect.style.display = 'none';
      scheduleDiv.innerHTML = '<div class="empty">Расписание пока не загружено</div>';
      return;
    }
    groupSelect.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');
    loadSchedule(groups[0]);
  } catch (e) {
    scheduleDiv.innerHTML = '<div class="empty">Не удалось загрузить список групп</div>';
  }
}

async function loadSchedule(group) {
  scheduleDiv.innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    const res = await fetch(`/api/schedule/${encodeURIComponent(group)}`);
    const lessons = await res.json();
    if (!lessons.length) {
      scheduleDiv.innerHTML = '<div class="empty">Нет данных для этой группы</div>';
      return;
    }
    const byDay = {};
    for (const l of lessons) {
      (byDay[l.day] ??= []).push(l);
    }
    scheduleDiv.innerHTML = Object.entries(byDay).map(([day, items]) => `
      <div class="day">
        <h3>${day}</h3>
        ${items.map(l => `
          <div class="lesson">
            <div class="time">${l.pair_number}. ${l.time}</div>
            <div class="subject">${l.subject}</div>
            <div class="meta">${l.room ? 'ауд. ' + l.room + '  ·  ' : ''}${l.teacher || ''}</div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch (e) {
    scheduleDiv.innerHTML = '<div class="empty">Ошибка загрузки расписания</div>';
  }
}

groupSelect.addEventListener('change', (e) => loadSchedule(e.target.value));
loadGroups();
</script>
</body>
</html>
